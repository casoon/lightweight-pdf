# Guardrail (issue #32) before adding a step here: the real cost driver is
# the number of distinct *feature combinations* the `test` job builds, not
# the step count — each new combination invalidates Cargo's build cache and
# forces a full rebuild of the dependency graph. Before adding one, answer:
#   1. Does it prove something no existing step already proves?
#   2. Does it need a new feature combination? If so, can it merge into an
#      existing one instead (e.g. onto the `--all-features` run)?
#   3. Does it need a new system dependency? Can it reuse what's already
#      installed (qpdf, poppler-utils, binaryen)?
#   4. Does it need to run on every PR — or does default-branch-only, a
#      `paths` filter, or `workflow_dispatch` cover it?
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install qpdf + poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - name: cargo fmt --check
        run: cargo fmt --all --check
      # One clippy pass at --all-features (superset of the old separate
      # default-features and +png runs — see issue #32: distinct feature
      # *combinations*, not step count, drive CI cost by invalidating
      # Cargo's build cache).
      - name: cargo clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # Covers the old separate "png feature" run too: `--all-features` on
      # the workspace already includes it.
      - name: cargo test (all features)
        run: cargo test --workspace --all-features
      - name: cargo build (lib, no default features)
        # `render()`/`render_with_diagnostics()` need the bundled
        # `default-fonts`; most examples/tests call those and are meant to
        # fail to compile here (the custom-font path — `render_with_fonts()`
        # + `demo_custom_font` — works fine without the feature, but that's
        # the exception, not the rule, so this step stays scoped to `--lib`).
        run: cargo clippy -p lightweight-pdf --no-default-features --lib -- -D warnings
      - name: cargo run --example demo_custom_font (no default features)
        run: cargo run -p lightweight-pdf --example demo_custom_font --no-default-features
      - name: cargo build (wasm32)
        run: cargo build --workspace --target wasm32-unknown-unknown --release
      - name: cargo run --example invoice
        run: cargo run -p lightweight-pdf --example invoice
      - name: cargo run --example report
        run: cargo run -p lightweight-pdf --example report
      - name: Crate boundary check (lightweight-pdf-writer must not depend on core/layout)
        run: |
          ! cargo tree -p lightweight-pdf-writer | grep -E "lightweight-pdf-core|lightweight-pdf-layout"
      - name: Crate boundary check (lightweight-pdf-fonts must not depend on core/layout)
        run: |
          ! cargo tree -p lightweight-pdf-fonts | grep -E "lightweight-pdf-core|lightweight-pdf-layout"

  audit:
    runs-on: ubuntu-latest
    # `rustsec/audit-check` reports findings as a check-run annotation via
    # the API, which needs this explicit grant (the default `GITHUB_TOKEN`
    # is read-only here) — surfaced by the `hyphenation` feature's first
    # informational (non-vulnerability) advisory, an unmaintained
    # transitive dependency (`bincode`, RUSTSEC-2025-0141).
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4
      # No `deny-warnings`: reports advisories without failing the workflow
      # on informational-only findings (see ADR-015 — the unmaintained
      # `ttf-parser` finding that motivated this job was resolved by
      # switching to `skrifa`, but this job stays as a standing check).
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  wasm-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Issue #31/#32: on a PR, only pay for this job if it could actually
      # be affected. Always runs on push to master (that's what keeps the
      # baseline/history meaningful).
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'crates/lightweight-pdf/**'
              - 'crates/lightweight-pdf-core/**'
              - 'crates/lightweight-pdf-layout/**'
              - 'crates/lightweight-pdf-writer/**'
              - 'crates/lightweight-pdf-fonts/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'examples/demo_invoice.rs'
              - 'examples/demo_offer.rs'
              - 'examples/demo_report.rs'
              - '.github/workflows/ci.yml'
              - '.github/wasm-size-baseline.json'
      - if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        uses: Swatinem/rust-cache@v2
      - name: Install binaryen (wasm-opt)
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: sudo apt-get update && sudo apt-get install -y binaryen
      # `--all-features` used to be passed here, but it enables wasm
      # proposals (found while wiring up issue #22's wasm-bindgen
      # bindings) that produce a binary real JS engines fail to
      # instantiate ("unknown import kind") — a measured-but-unloadable
      # artifact. The flags below are exactly `rustc --target
      # wasm32-unknown-unknown --print cfg`'s `target_feature` list for
      # this target (i.e. what it actually emits by default) — not a
      # trial-and-error subset, so a future rustc enabling one more
      # default feature would need this list updated too.
      - name: Build Generator config
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: cargo build --release --target wasm32-unknown-unknown -p lightweight-pdf --no-default-features --features wasm,wasm-size-probe,default-fonts,compress
      - name: Measure Generator config
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: |
          f=target/wasm32-unknown-unknown/release/lightweight_pdf.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-multivalue --enable-mutable-globals --enable-nontrapping-float-to-int --enable-reference-types --enable-sign-ext "$f" -o /tmp/generator.opt.wasm
          gzip -9 -c /tmp/generator.opt.wasm > /tmp/generator.opt.wasm.gz
          echo "### Generator size" >> "$GITHUB_STEP_SUMMARY"
          echo "raw: $(stat -c%s "$f") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "wasm-opt -Oz: $(stat -c%s /tmp/generator.opt.wasm) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "gzip -9: $(stat -c%s /tmp/generator.opt.wasm.gz) bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Build Standard config
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: cargo build --release --target wasm32-unknown-unknown -p lightweight-pdf --no-default-features --features wasm,wasm-size-probe,default-fonts,png,compress
      - name: Measure Standard config
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: |
          f=target/wasm32-unknown-unknown/release/lightweight_pdf.wasm
          wasm-opt -Oz --enable-bulk-memory --enable-multivalue --enable-mutable-globals --enable-nontrapping-float-to-int --enable-reference-types --enable-sign-ext "$f" -o /tmp/standard.opt.wasm
          gzip -9 -c /tmp/standard.opt.wasm > /tmp/standard.opt.wasm.gz
          echo "### Standard size" >> "$GITHUB_STEP_SUMMARY"
          echo "raw: $(stat -c%s "$f") bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "wasm-opt -Oz: $(stat -c%s /tmp/standard.opt.wasm) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "gzip -9: $(stat -c%s /tmp/standard.opt.wasm.gz) bytes" >> "$GITHUB_STEP_SUMMARY"
      # Regression gate (issue #31): compares each config's gzip size
      # against .github/wasm-size-baseline.json with a tolerance, since
      # font-asset size dominates this measurement (see ADR-014/ADR-015 in
      # the local plan/00-decisions.md) and a zero-tolerance gate would
      # flag every unrelated code change the moment rounding shifts a few
      # bytes. Legitimate growth (new font, new default feature) is
      # expected to update the baseline file in the same commit — that's
      # the intended way past this, not a reason to widen the tolerance.
      - name: Check size regression against baseline
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: |
          base="$GITHUB_WORKSPACE/.github/wasm-size-baseline.json"
          tolerance=$(jq '.tolerance_percent' "$base")
          fail=0
          for cfg in generator standard; do
            actual=$(stat -c%s "/tmp/${cfg}.opt.wasm.gz")
            baseline=$(jq ".${cfg}_gzip_bytes" "$base")
            limit=$(( baseline * (100 + tolerance) / 100 ))
            echo "${cfg}: ${actual} bytes (baseline ${baseline}, limit ${limit})" >> "$GITHUB_STEP_SUMMARY"
            if [ "$actual" -gt "$limit" ]; then
              echo "::error::${cfg} config grew to ${actual} gzip bytes, more than ${tolerance}% over the ${baseline}-byte baseline in .github/wasm-size-baseline.json. If this is expected (new font, new default feature), update that file in this commit."
              fail=1
            fi
          done
          exit $fail
      # Render throughput + output size (issue #31): a native release
      # build, not wasm — the demos already exist for this purpose (README
      # links them), no criterion dependency, just wall-clock over 5 runs.
      - name: Build native demos (release)
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: cargo build --release -p lightweight-pdf --example demo_invoice --example demo_offer --example demo_report
      - name: Measure render throughput + output size
        if: github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true'
        run: |
          echo "### Render throughput (native release, avg of 5 runs)" >> "$GITHUB_STEP_SUMMARY"
          for d in demo_invoice demo_offer demo_report; do
            bin="target/release/examples/${d}"
            "$bin" >/dev/null
            t0=$(date +%s%N)
            for i in 1 2 3 4 5; do "$bin" >/dev/null; done
            t1=$(date +%s%N)
            avg_ms=$(( (t1 - t0) / 5 / 1000000 ))
            size=$(stat -c%s "examples/${d}.pdf")
            echo "${d}: ${avg_ms}ms avg, ${size} bytes output" >> "$GITHUB_STEP_SUMMARY"
          done
