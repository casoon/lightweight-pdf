[package]
name = "lightweight-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight, dependency-minimal Rust PDF generation for recurring business documents"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
lightweight-pdf-core = { path = "../lightweight-pdf-core" }
lightweight-pdf-layout = { path = "../lightweight-pdf-layout" }
lightweight-pdf-writer = { path = "../lightweight-pdf-writer" }
lightweight-pdf-fonts = { path = "../lightweight-pdf-fonts" }
png = { version = "0.18.1", optional = true, default-features = false }

[features]
default = ["default-fonts"]
default-fonts = []
wasm = []
wasm-size-probe = []
png = ["dep:png"]
