[package]
name = "lightweight-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight, dependency-minimal Rust PDF generation for recurring business documents"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
lightweight-pdf-core = { path = "../lightweight-pdf-core", version = "0.2.1" }
lightweight-pdf-layout = { path = "../lightweight-pdf-layout", version = "0.2.1" }
lightweight-pdf-writer = { path = "../lightweight-pdf-writer", version = "0.2.1", default-features = false }
lightweight-pdf-fonts = { path = "../lightweight-pdf-fonts", version = "0.2.1" }
png = { version = "0.18.1", optional = true, default-features = false }
wasm-bindgen = { version = "0.2.127", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
lightweight-pdf-test-support = { path = "../lightweight-pdf-test-support" }
lightweight-pdf-testing = { path = "../lightweight-pdf-testing" }

[features]
default = ["default-fonts", "compress"]
default-fonts = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "serde"]
wasm-size-probe = []
png = ["dep:png"]
compress = ["lightweight-pdf-writer/compress"]
hyphenation = ["lightweight-pdf-layout/hyphenation"]
pdf-a = ["lightweight-pdf-writer/pdf-a"]
zugferd = ["pdf-a", "lightweight-pdf-writer/zugferd"]
tagged-pdf = ["pdf-a", "lightweight-pdf-writer/tagged-pdf"]
serde = ["dep:serde", "lightweight-pdf-core/serde"]
schemars = ["lightweight-pdf-core/schemars"]

# `wasm-pack`'s own `wasm-opt` post-processing call doesn't pass
# `--enable-bulk-memory`, which current rustc's wasm32-unknown-unknown
# target emits by default — validator failure at optimization time, not
# a bug in this crate. `bindings/js`'s own build script runs
# `wasm-opt -Oz --all-features` explicitly instead (the same invocation
# CI's `wasm-size` job already uses successfully).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[[test]]
name = "serde_json"
required-features = ["serde"]

[[test]]
name = "template"
required-features = ["serde"]

[[test]]
name = "tagged_pdf"
required-features = ["tagged-pdf", "png"]

[[example]]
name = "demo_invoice"
path = "../../examples/demo_invoice.rs"

[[example]]
name = "demo_offer"
path = "../../examples/demo_offer.rs"

[[example]]
name = "demo_credentials"
path = "../../examples/demo_credentials.rs"

[[example]]
name = "demo_concept"
path = "../../examples/demo_concept.rs"

[[example]]
name = "demo_documentation"
path = "../../examples/demo_documentation.rs"

[[example]]
name = "demo_report"
path = "../../examples/demo_report.rs"

[[example]]
name = "demo_custom_font"
path = "../../examples/demo_custom_font.rs"

[[example]]
name = "demo_pdf_a3b"
path = "../../examples/demo_pdf_a3b.rs"
required-features = ["pdf-a", "png"]

[[example]]
name = "demo_zugferd"
path = "../../examples/demo_zugferd.rs"
required-features = ["zugferd"]

[[example]]
name = "demo_pdf_ua"
path = "../../examples/demo_pdf_ua.rs"
required-features = ["tagged-pdf", "png"]
