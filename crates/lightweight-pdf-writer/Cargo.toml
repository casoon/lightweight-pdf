[package]
name = "lightweight-pdf-writer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal PDF object/xref/stream writer for lightweight-pdf, zero required dependencies (FlateDecode compression via the optional miniz_oxide)"

[dependencies]
miniz_oxide = { version = "0.8", optional = true, default-features = false, features = ["with-alloc"] }

[features]
default = ["compress"]
compress = ["dep:miniz_oxide"]
# PDF/A-3b output (issue #25): XMP metadata, `/OutputIntent` with an
# embedded sRGB ICC profile (`assets/sRGB2014.icc`, ICC's own freely
# redistributable reference profile, 3 KiB — small enough that gating it
# is about explicitness, not size), transparency-group colour space.
pdf-a = []
# ZUGFeRD/Factur-X (issue #26): embeds a caller-supplied EN 16931 invoice
# XML as an associated file, with the required Factur-X XMP extension
# schema on top of `pdf-a`'s XMP packet (ZUGFeRD *is* PDF/A-3 plus this,
# not an independent format).
zugferd = ["pdf-a"]
# Tagged PDF/PDF-UA (issue #27): structure tree (/StructTreeRoot),
# marked content (BDC/EMC with MCIDs), /MarkInfo, /Lang, artifact-marked
# watermark/header/footer. Implies `pdf-a` (ADR-019: PDF/UA without
# PDF/A isn't a supported combination) — reuses its XMP/OutputIntent
# machinery, adds `pdfuaid:*` alongside the existing `pdfaid:*`.
tagged-pdf = ["pdf-a"]
